name: Setup YAMP Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf /tmp/yamp-project
          mkdir -p /tmp/yamp-project

          unzip -q "${{ steps.zip.outputs.file }}" -d /tmp/yamp-project

          cp -a /tmp/yamp-project/. .

          rm -f "${{ steps.zip.outputs.file }}"
          rm -f .github/workflows/setup.yml

      - name: Commit project files
        run: |
          git config user.name "YAMP Setup"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Set up YAMP Android project"
          git push
